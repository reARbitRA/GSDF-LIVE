name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (lifecycle scripts disabled)
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Test (with coverage)
        run: npx vitest run --coverage
      - name: Build (no Gemini key — must still succeed)
        run: npm run build
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
